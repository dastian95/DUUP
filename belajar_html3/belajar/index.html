<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout web menggunakan frameset</title>
    <style>
        
    </style>
</head>
<frameset rows="100, *, 50" framespacing="1" border="1" framespacing="1">
    <!-- header -->
    <frame src="header.html" name="headerframe" scrolling="no">

    <!-- sidebar & main content -->
    <frameset cols="25%, 75%">
        <frame src="sidebar.html" name="menuframe">
        <frame src="main.html" name="showframe">
    </frameset>

    <!-- footer -->
    <frame src="footer.html">
</frameset>
</html>
