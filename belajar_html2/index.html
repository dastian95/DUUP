<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Black Goose Bistro | Pizza-on-Demand</title>
</head>
<body>
    <h1>Black Goose Bistro | Pizza-on-Demand</h1>
    <p>
        Our 12&quot; wood-fired pizzas are available for delivery.
        Build your custom pizza and we'll deliver it within an hour.
    </p>

    <form action="http://www.blackgoosebistro.com/pizza.php" method="post">

        <fieldset>
            <legend>Your Information</legend>
            <p>
                <label for="customername">Name:</label>
                <input type="text" id="customername" name="customername">
            </p>
            <p>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address">
            </p>
            <p>
                <label for="telephone">Telephone Number:</label>
                <input type="tel" id="telephone" name="telephone">
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </p>
            <p>
                <label for="instructions">Delivery instructions:</label><br>
                <textarea id="instructions" name="instructions" rows="4" cols="50"
                    maxlength="400" placeholder="No more than 400 characters long"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Design Your Dream Pizza</legend>
            <p>Pizza specs</p>

            <p>Crust (Choose one):</p>
            <p>
                <label><input type="radio" name="crust" value="Classic white" required> Classic white</label><br>
                <label><input type="radio" name="crust" value="Multigrain"> Multigrain</label><br>
                <label><input type="radio" name="crust" value="Cheese-stuffed crust"> Cheese-stuffed crust</label><br>
                <label><input type="radio" name="crust" value="Gluten-free"> Gluten-free</label>
            </p>

            <p>Toppings (Choose as many as you want):</p>
            <p>
                <label><input type="checkbox" name="toppings[]" value="Red sauce" checked> Red sauce</label><br>
                <label><input type="checkbox" name="toppings[]" value="White sauce"> White sauce</label><br>
                <label><input type="checkbox" name="toppings[]" value="Mozzarella Cheese"> Mozzarella Cheese</label><br>
                <label><input type="checkbox" name="toppings[]" value="Pepperoni"> Pepperoni</label><br>
                <label><input type="checkbox" name="toppings[]" value="Mushrooms"> Mushrooms</label><br>
                <label><input type="checkbox" name="toppings[]" value="Peppers"> Peppers</label><br>
                <label><input type="checkbox" name="toppings[]" value="Anchovies"> Anchovies</label>
            </p>

            <p>
                <label for="pizzas">How many pizzas:</label>
                <select id="pizzas" name="pizzas">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Bring me a pizza!">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>
</html>
